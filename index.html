<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Видеостудия</title>
<style>
:root{--bg:#e9eef2;--ink:#12202b;--mute:#5b6b77;--line:#c4cfd7;--card:#f7f9fa;--acc:#2f5bff;--acc-ink:#fff;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0f171d;--ink:#e6edf2;--mute:#8da0ad;--line:#2a3a46;--card:#16222b;--acc:#6f8cff;--acc-ink:#0b1220;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.6rem;margin:8px 0 4px;letter-spacing:-.02em}
p.sub{margin:0 0 20px;color:var(--mute)}
label{display:block;font-weight:600;font-size:.9rem;margin:16px 0 6px}
textarea,input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
textarea{min-height:110px;resize:vertical}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:10px;background:var(--acc);color:var(--acc-ink);font:inherit;font-weight:700}
button:disabled{opacity:.55}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
/* the memorable part: a film-strip frame around the result */
.strip{margin-top:28px;background:#0a0f13;border-radius:8px;padding:14px 22px;position:relative;
 background-image:radial-gradient(circle,var(--bg) 3px,transparent 3.5px),radial-gradient(circle,var(--bg) 3px,transparent 3.5px);
 background-size:22px 14px;background-position:0 0,0 100%;background-repeat:repeat-x}
.screen{aspect-ratio:16/9;background:#1a242c;border-radius:3px;display:grid;place-items:center;color:#8da0ad;text-align:center;padding:12px;font-size:.95rem;overflow:hidden}
.screen video{width:100%;height:100%;object-fit:contain;background:#000}
#err{color:var(--err);margin-top:12px;min-height:1.4em}
a.dl{display:inline-block;margin-top:12px;color:var(--acc);font-weight:600}
</style>
</head>
<body>
<main>
  <h1>Видеостудия</h1>
  <p class="sub">Опиши сцену, и модель снимет клип.</p>

  <label for="prompt">Что должно быть в кадре</label>
  <textarea id="prompt" placeholder="Кит плывёт сквозь лучи солнца, камера движется рядом"></textarea>

  <label for="img">Картинка-референс (ссылка, по желанию)</label>
  <input id="img" type="url" inputmode="url" placeholder="https://…">

  <div class="row">
    <div><label for="dur">Секунды</label>
      <select id="dur"><option>3</option><option selected>4</option><option>6</option><option>8</option></select></div>
    <div><label for="res">Качество</label>
      <select id="res"><option value="480p" selected>480p</option><option value="720p">720p</option></select></div>
    <div><label for="asp">Формат</label>
      <select id="asp"><option>16:9</option><option>9:16</option><option>1:1</option></select></div>
  </div>

  <button id="go">Создать видео</button>
  <div id="err" role="alert"></div>

  <div class="strip"><div class="screen" id="screen">Здесь появится видео</div></div>
</main>

<script>
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));

$("go").onclick = async () => {
  const prompt = $("prompt").value.trim();
  $("err").textContent = "";
  if (!prompt) { $("err").textContent = "Сначала напиши, что снимать."; return; }
  $("go").disabled = true;
  $("screen").textContent = "Отправляю задачу…";
  try {
    const r = await fetch("/api/generate", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt, image_url: $("img").value.trim(), duration: $("dur").value, resolution: $("res").value, aspect: $("asp").value })
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "Не удалось начать");
    const started = Date.now();
    while (Date.now() - started < 10 * 60 * 1000) {
      $("screen").textContent = "Генерируется… " + Math.round((Date.now() - started) / 1000) + " с";
      await sleep(4000);
      const s = await (await fetch("/api/status?id=" + encodeURIComponent(j.id))).json();
      if (s.status === "done" && s.url) {
        $("screen").innerHTML = "";
        const v = document.createElement("video");
        v.src = s.url; v.controls = true; v.autoplay = true; v.loop = true; v.playsInline = true;
        $("screen").appendChild(v);
        const a = document.createElement("a"); a.className = "dl"; a.href = s.url; a.target = "_blank"; a.rel = "noopener"; a.textContent = "Скачать видео";
        $("screen").parentElement.appendChild(a);
        return;
      }
      if (s.status === "failed") throw new Error(s.error || "Генерация не удалась");
    }
    throw new Error("Слишком долго. Попробуй ещё раз.");
  } catch (e) {
    $("err").textContent = e.message;
    $("screen").textContent = "Здесь появится видео";
  } finally {
    $("go").disabled = false;
  }
};
</script>
</body>
</html>
